projects:
  - id: timezone-planner
    title: TimeZone Planner
    summary: Clean world-clock companion with time travel and meeting planner tools.
    description: >
      Track multiple locations, preview future or past times with a time slider,
      and surface overlapping office hours using Meeting Planner. Customize
      24-hour time, seconds, flags, and office-hour ranges.
    platforms:
      - ios
      - macos
    stack:
      - SwiftUI
      - AppKit
      - MapKit
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/timezone-planner/id6757096147

  - id: sliderush-puzzle
    title: SlideRush - Puzzle
    summary: Modern sliding puzzle with custom boards and best-score challenges.
    description: >
      A modern sliding-puzzle game with clean design, custom boards, and
      best-score challenges.
    platforms:
      - ios
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/sliderush-puzzle/id6757233640

  - id: gst-calculator-2-0
    title: GST Calculator - 2.0
    summary: Instant GST add/remove calculator with flexible rates.
    description: >
      GST Quick Calc makes GST math painless with instant inclusive/exclusive
      results, flexible rate selection, and a clean interface built for quick
      checks on prices and invoices.
    platforms:
      - ios
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/gst-calculator-2-0/id6756962902

  - id: numble-guess
    title: Numble Guess
    summary: Challenge your mind with Guess the Number, the ultimate code-breaking puzzle game that's easy to learn but hard to master!
    description: >
      Challenge your mind with Guess the Number, the ultimate code-breaking puzzle game that's easy to learn but hard to master! Put your logic and deduction skills to the test as you try to guess the secret number in the fewest attempts possible. With a clean, modern interface and engaging gameplay, this is the brain-training exercise you won't be able to put down.
    platforms:
      - ios
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/numble-guess/id6758044069

  - id: cheque-words
    title: Cheque Words
    summary: Convert numbers into clear words for cheques, invoices, and records.
    description: >
      Cheque Words converts numeric amounts into accurate written words instantly.
      Built for cheque writing and finance workflows, it helps reduce amount entry
      mistakes with a clean, fast, and reliable experience.
    platforms:
      - ios
    stack:
      - SwiftUI
      - StoreKit
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/cheque-words/id6760286602

  - id: bitwise
    title: BitWise
    summary: Fast number-system converter for Binary, Octal, Decimal, and Hex.
    description: >
      BitWise converts numbers across base 2, 8, 10, and 16 instantly.
      It supports fractional values, validates input by selected base, and
      offers quick copy and share actions for daily developer and student workflows.
    platforms:
      - ios
    stack:
      - SwiftUI
      - StoreKit
      - MessageUI
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/binary-bridge/id6760290782

  - id: tip-calculator
    title: Tip Calculator
    summary: Quick tip, total, and split-bill calculator with multi-currency support.
    description: >
      Tip Calculator helps you calculate tip and total instantly using percentage
      or fixed tip input. Split bills across people, switch currencies, optionally
      round values, and copy or share clean results in seconds.
    platforms:
      - ios
    stack:
      - SwiftUI
      - StoreKit
      - MessageUI
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/1-tip-calc/id6756928611

  - id: cash-notes
    title: Cash Notes
    summary: Receipt notes app for quickly creating, managing, and sharing cash receipts.
    description: >
      Cash Notes helps you create clean receipt-style notes with itemized entries,
      totals, and flexible sharing. Organize receipts, search quickly, keep your
      last opened receipt, and export in multiple formats for daily business use.
    platforms:
      - ios
    stack:
      - SwiftUI
      - StoreKit
      - UserDefaults
    links:
      - label: App Store
        url: https://apps.apple.com/ca/app/cash-notes-receipt/id6758351627

  - id: cash-counter
    title: Cash Counter
    summary: Denomination-based cash counting with fast totals and export options.
    description: >
      Cash Counter helps you count notes and coins quickly with support for
      major/minor units, optional legacy denominations, Indian/International
      number formats, and export/share in multiple formats for daily cash workflows.
    platforms:
      - ios
    stack:
      - SwiftUI
      - Combine
      - UserDefaults
      - UIKit
    links:
      - label: App Store
        url: https://apps.apple.com/us/app/cash-counter-multi-currency/id6765703474
